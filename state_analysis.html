{% extends 'base.html' %}
{% block content %}
<h2>State-wise Crime Breakdown</h2>
<div class="card p-3 mt-3">
    <table class="table table-hover">
        <thead class="table-dark">
            <tr>
                <th>State</th>
                <th>Total Incidents</th>
                <th>Arrests Made</th>
                <th>Most Frequent Crime</th>
            </tr>
        </thead>
        <tbody>
            {% for s in state_summary %}
            <tr>
                <td><strong>{{ s.state }}</strong></td>
                <td>{{ s.Total_Incidents }}</td>
                <td>{{ s.Arrests }}</td>
                <td><span class="badge bg-secondary">{{ s.Top_Crime }}</span></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
