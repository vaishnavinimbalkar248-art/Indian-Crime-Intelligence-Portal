<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPS Location | Crime Intelligence Portal</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Leaflet Map -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .gps-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .gps-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .gps-title {
            font-weight: 700;
            color: #1f3c88;
        }

        .location-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .coordinate {
            font-size: 17px;
            font-weight: 600;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 12px;
            margin-top: 20px;
        }

        .status {
            margin-top: 15px;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="gps-container">

    <div class="gps-card">

        <div class="text-center mb-4">

            <h2 class="gps-title">
                📍 My GPS Location
            </h2>

            <p class="text-muted">
                Allow location access to find your current position.
            </p>

        </div>


        <div class="text-center">

            <button
                class="btn btn-primary btn-lg"
                onclick="getMyLocation()">

                📍 Get My Current Location

            </button>

        </div>


        <div id="status" class="status text-center">
            Location has not been detected yet.
        </div>


        <div class="location-box">

            <div class="row">

                <div class="col-md-6">

                    <p class="mb-1 text-muted">
                        Latitude
                    </p>

                    <p
                        id="latitude"
                        class="coordinate">
                        —
                    </p>

                </div>


                <div class="col-md-6">

                    <p class="mb-1 text-muted">
                        Longitude
                    </p>

                    <p
                        id="longitude"
                        class="coordinate">
                        —
                    </p>

                </div>

            </div>

        </div>


        <div id="map"></div>

    </div>

</div>


<!-- Leaflet JavaScript -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

let map;
let marker;


// Initialize map
function initializeMap() {

    map = L.map('map').setView(
        [20.5937, 78.9629],
        5
    );


    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);
}


// Get user's GPS location
function getMyLocation() {

    const status =
        document.getElementById('status');

    if (!navigator.geolocation) {

        status.innerHTML =
            '❌ GPS is not supported by this browser.';

        status.className =
            'status text-center text-danger';

        return;
    }


    status.innerHTML =
        '📍 Detecting your location...';

    status.className =
        'status text-center text-primary';


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            document.getElementById(
                'latitude'
            ).innerText =
                latitude.toFixed(6);


            document.getElementById(
                'longitude'
            ).innerText =
                longitude.toFixed(6);


            status.innerHTML =
                '✅ Your current location has been detected.';

            status.className =
                'status text-center text-success';


            // Move map to user
            map.setView(
                [latitude, longitude],
                16
            );


            // Remove old marker
            if (marker) {
                map.removeLayer(marker);
            }


            // Add new marker
            marker = L.marker(
                [latitude, longitude]
            )
            .addTo(map)
            .bindPopup(
                '<b>📍 Your Current Location</b><br>' +
                'Latitude: ' +
                latitude.toFixed(6) +
                '<br>' +
                'Longitude: ' +
                longitude.toFixed(6)
            )
            .openPopup();

        },


        function(error) {

            let message =
                'Unable to detect your location.';


            if (
                error.code ===
                error.PERMISSION_DENIED
            ) {

                message =
                    '❌ Location permission was denied. Please allow location access in your browser.';

            }
            else if (
                error.code ===
                error.POSITION_UNAVAILABLE
            ) {

                message =
                    '❌ Your location is currently unavailable.';

            }
            else if (
                error.code ===
                error.TIMEOUT
            ) {

                message =
                    '❌ Location request timed out. Please try again.';
            }


            status.innerHTML = message;

            status.className =
                'status text-center text-danger';

        },


        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );
}


// Start map
initializeMap();

</script>

</body>
</html>
