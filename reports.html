{% extends 'base.html' %}
{% block content %}
<h2>Reports & Data Export</h2>
<div class="card p-4 mb-4">
    <h5>Filtered Summary</h5>
    <ul>
        <li>Total Records: <strong>{{ summary.total_records }}</strong></li>
        <li>Arrests Made: <strong>{{ summary.arrests_made }}</strong></li>
        <li>States Included: <strong>{{ summary.unique_states }}</strong></li>
    </ul>
    <a href="/export-csv?state={{ sel_state }}&crime_type={{ sel_crime }}&year={{ sel_year }}&arrest={{ sel_arrest }}" class="btn btn-success col-md-3">Export CSV Report</a>
</div>
{% endblock %}
